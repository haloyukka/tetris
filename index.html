<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Custom Tetris</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="game-wrap">
  <!-- Left panel -->
  <div class="panel">
    <div class="box">
      <h3>HOLD</h3>
      <canvas class="mini-cv" id="hold-cv" width="96" height="72"></canvas>
    </div>
    <div class="box">
      <div id="controls-info">
        ← → 移動<br>
        ↑ 回転<br>
        ↓ ソフトドロップ<br>
        Space ハードドロップ<br>
        C / Shift ホールド<br>
        P 一時停止
      </div>
    </div>
  </div>

  <!-- Board -->
  <canvas id="board" width="300" height="600"></canvas>

  <!-- Right panel -->
  <div class="panel">
    <div class="box">
      <h3>NEXT</h3>
      <canvas class="mini-cv" id="next-cv" width="96" height="72"></canvas>
    </div>
    <div class="box"><h3>スコア</h3><div class="val" id="score">0</div></div>
    <div class="box"><h3>最高</h3><div class="val" id="hiscore">0</div></div>
    <div class="box"><h3>レベル</h3><div class="val" id="level">1</div></div>
    <div class="box"><h3>ライン</h3><div class="val" id="lines">0</div></div>
    <button class="btn" id="pause-btn">PAUSE</button>
    <button class="btn" id="settings-btn">設定</button>
  </div>
</div>

<!-- Title / Game Over overlay -->
<div id="overlay">
  <h2>Custom Tetris</h2>
  <p>スペースキーまたはボタンでスタート</p>
  <button class="btn" id="start-btn">スタート</button>
</div>

<!-- Settings modal -->
<div id="settings-modal">
  <div id="settings-box">
    <h2>設定</h2>

    <div class="s-section">
      <label>テーマ</label>
      <div class="theme-btns" id="theme-btns"></div>
    </div>

    <div class="s-section">
      <label>ブロック画像</label>
      <div class="file-row">
        <label class="file-label" for="block-upload">画像を選択</label>
        <input type="file" id="block-upload" accept="image/png,image/jpeg">
        <button class="reset-btn" id="reset-block">リセット</button>
      </div>
      <img class="prev-img" id="block-prev" alt="">
    </div>

    <div class="s-section">
      <label>背景画像</label>
      <div class="file-row">
        <label class="file-label" for="bg-upload">画像を選択</label>
        <input type="file" id="bg-upload" accept="image/png,image/jpeg">
        <button class="reset-btn" id="reset-bg">リセット</button>
      </div>
      <img class="prev-img" id="bg-prev" alt="">
    </div>

    <button class="btn" id="close-settings">閉じる</button>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/game.js"></script>
<script src="js/settings.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
